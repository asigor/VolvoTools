name: Build VolvoTools

'on':
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize submodules
        shell: pwsh
        run: |
          # Public submodules use SSH URLs in .gitmodules; rewrite them to HTTPS for CI.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan
          conan profile detect --force

      - name: Install dependencies (x86)
        shell: pwsh
        run: conan install . --build=missing --profile=default -s arch=x86 -s compiler.cppstd=17

      - name: Configure CMake (x86)
        shell: pwsh
        run: cmake --preset conan-default -A Win32

      - name: Build (x86)
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Rename x86 executables
        shell: pwsh
        run: |
          $date = Get-Date -Format "ddMMyy"
          $shortCommit = "${{ github.sha }}".Substring(0, 7)
          Get-ChildItem -Path build -Filter "*.exe" -Recurse | ForEach-Object {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            $ext = [System.IO.Path]::GetExtension($_.Name)
            Rename-Item -LiteralPath $_.FullName -NewName "${name}_x86_${date}_${shortCommit}${ext}"
          }

      - name: Upload x86 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VolvoTools_Build_x86
          path: build/**/Release/*.exe
          if-no-files-found: error

  build-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize submodules
        shell: pwsh
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan
          conan profile detect --force

      - name: Install dependencies (x64)
        shell: pwsh
        run: conan install . --build=missing --profile=default -s compiler.cppstd=17

      - name: Configure CMake (x64)
        shell: pwsh
        run: cmake --preset conan-default -A x64

      - name: Build (x64)
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Rename x64 executables
        shell: pwsh
        run: |
          $date = Get-Date -Format "ddMMyy"
          $shortCommit = "${{ github.sha }}".Substring(0, 7)
          Get-ChildItem -Path build -Filter "*.exe" -Recurse | ForEach-Object {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            $ext = [System.IO.Path]::GetExtension($_.Name)
            Rename-Item -LiteralPath $_.FullName -NewName "${name}_x64_${date}_${shortCommit}${ext}"
          }

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VolvoTools_Build_x64
          path: build/**/Release/*.exe
          if-no-files-found: error

  release:
    needs:
      - build-x86
      - build-x64
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: VolvoTools_Build_x64
          path: artifacts/x64

      - name: Download x86 artifacts
        uses: actions/download-artifact@v4
        with:
          name: VolvoTools_Build_x86
          path: artifacts/x86

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path artifacts -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            throw "No executable artifacts were downloaded."
          }
          $artifacts | Select-Object FullName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
